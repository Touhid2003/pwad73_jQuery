<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/jquery.min.js"></script>
</head>
<body>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Consectetur saepe adipisci sint soluta atque recusandae odio ipsam consequuntur. Distinctio inventore unde quidem recusandae? Magni rem beatae excepturi omnis harum expedita!</p>

    <button class="btn1">Hide All</button>
    <button class="btn2">Show All</button>
    <button class="btn3">show/hide</button>

    <script>
        $(document).ready(function(){
            $(".btn1").click(function(){
                $("P").hide();
            });
              $(".btn2").click(function(){
                $("P").show();
            });
              $(".btn3").click(function(){
                $("P").toggle();
            });
        })
    </script>
    
</body>
</html>
