<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/jquery.min.js"></script>
</head>
<body>

        <h1>Content will load here</h1>

    </div>
    <button id="btn">Click Here</button>

                $("#mybox").load("load.txt");
            });
        });
    </script>
</body>
