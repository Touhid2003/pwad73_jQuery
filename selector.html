<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/jquery.min.js"></script>
</head>
<body>

    <h1>This is heading with h1</h1>
    <h2>This is heading with h3</h2>

    <p>This is my frist paragraph</p>

    <ul>
        <li>Belly</li>
        <li>Chemeli</li>
        <li>Waterlily</li>
        <li>Rose</li>
    </ul>

    <button class="btn1">Hide All</button> 
    <button class="btn2">Hide Paragraph</button> 
    <button class="btn3">Hide list item</button> 

    <script>
        $(document).ready(function(){
            $(".btn1").click(function(){
                $("*").hide();
            });

              $(".btn2").click(function(){
                $("h2").hide();
            });
               $(".btn2").click(function(){
                $("p").hide();
            });
               $(".btn3").click(function(){
                $("ul li:first").hide();
            });

        });

    </script>
    
</body>
</html>
